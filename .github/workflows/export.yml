name: Export ONNX
on:
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install paddlepaddle onnxruntime -q

      - name: Download model
        run: |
          wget -q "https://paddle-model-ecology.bj.bcebos.com/paddlex/official_inference_model/paddle3.0.0/PP-DocLayout-M_infer.tar"
          tar xf PP-DocLayout-M_infer.tar
          ls -lh PP-DocLayout-M_infer/

      - name: Export
        run: python export.py

      - uses: actions/upload-artifact@v4
        with:
          name: onnx
          path: PP-DocLayout-M.onnx
